name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default: every job starts read-only and only the jobs
# that need more request it.
permissions:
  contents: read

# A new push to a PR branch cancels the previous run for that ref; runs on
# main are never cancelled so every merge is fully validated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Static site (check, build, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # Fails the job when dist contains private keys, sb_secret_ keys,
      # .env files, secret assignments or private paths, or lacks index.html.
      - name: Scan static output for private data
        run: node scripts/check-static-output.mjs dist

      - name: Node unit tests
        run: npm test

  python:
    name: Python (3.13, unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s test -p 'test_*.py' -v

  supabase:
    name: Supabase migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start local database
        run: supabase db start

      - name: Database tests
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop
